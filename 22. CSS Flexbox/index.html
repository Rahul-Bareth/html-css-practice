<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flexbox</title>
     <style>
       
       * {
        margin: 0;
        padding: 0;
       }

       .container {
        border: 2px solid red;
        display: flex;
        height: 80vh;
        align-items: center;
        justify-content: center;
        /*flex-wrap: wrap;*/
        align-content: center;
        flex-flow: row wrap;
        /*gap: 20px;
        row-gap: 30px;
        column-gap: 10px;*/
        gap: 30px 10px;
        color: white;
       }

       .item {
        /*flex-grow: 1;*/
        height: 32px;
        width: 32px;
        background: rgb(10, 83, 115);
        border: 2px solid rgb(87, 222, 186);
       /* margin: 3px;*/
        padding: 4px;
        text-align: center;
       }

       .order-1 {
        order: 1;
       }

       .order-2 {
        order: 2;
       }
  
       .order-3 {
        order: 3;
       }     
       
       .item1 {
        /*flex-grow: 2;*/
        flex-shrink: 2;
       }

     </style>
</head>
<body>

  <main>
    <div class="container">
      <div class="item item1"></div>
      <div class="item"></div>
      <div class="item"></div>
      <div class="item"></div>
      <div class="item"></div>
      <div class="item"></div>
      <div class="item order-1">10</div>
      <div class="item"></div>
  </main>

</body>
</html>
