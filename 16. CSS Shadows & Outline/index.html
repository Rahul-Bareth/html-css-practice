<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Shadows and Outline</title>
  <style>
 
 .box {
  border: 2px solid black;
  padding: 20px;
  box-shadow: inset 4px 6px 4px teal;
 }

 .text-element {
   border: 2px solid rgb(255, 0, 0);
   text-shadow: 6px 5px 8px rgb(109, 239, 9);
   outline: 2px solid rgb(0, 254, 0);
   border-radius: 10px;
 }

  </style>
</head>
<body>
  <div class="box">
   I am a box
  </div>
  <p class="text-element">
   Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat dolor.
  </p>
</body>
</html>
