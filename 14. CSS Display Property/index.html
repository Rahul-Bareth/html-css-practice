<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Display Properties</title>
   <style>
    * {
      margin: 0;
      padding: 0;
    }

   .box {
    background: teal;
    color: white;
    border: 2px solid orange;
    display: inline-block;
    width: 333px;
    padding: 30px;
    margin: 30px;
   }

   .box1 {
    display: none;
    /*visibility: hidden;*/
   }

   </style>
</head>
<body>
    <div class="box box1">
      i am a box
    </div>
    <div class="box">also a nice box</div>
    <span>I am good</span>
    <span>boy</span>
</body>
</html>
