<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS List</title>
    <style>

      * {
        margin: 0;
        padding: 0;
      }

      /*
      nav ul li {
        border: 2px solid green;
        list-style: devanagari;
        background: orange;
        list-style-position: inside;
      } */

      ul {
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        padding: 20px;
        /*height: 50px;*/
        gap: 20px;
        background: orange;
        border: 2px solid green;
      }

      li {
        list-style: none;
      }

    </style>
  </head>
  <body>
    <nav>
      <ul>
        <li>Home</li>
        <li>About</li>
        <li>Career</li>
        <li>Contact</li>
      </ul>
    </nav>
  </body>
</html>
