<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 3</title>
     <style>

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      .card-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        border-radius: 10px;
        overflow: hidden;
        background-color: rgb(246, 233, 233);
        height: 360px;
        width: 230px;
        padding: 5px;
        cursor: pointer;
      }

      img {
        height: 150px;
        width: 100%;
        border-radius: 10px;
        object-fit: cover;
      }

      button {
        padding: 2px 9px;
        border-radius: 8px;
        border: none;
        background: rgb(245, 186, 186);
        margin-top: 10px;
        margin-left: 10px;
        margin-bottom: 6px;
        cursor: pointer;
      }

      h3 {
        font-size: 20px; 
        margin-left: 10px;
        color: rgb(8, 18, 8);
      }
      
      p {
        margin-left: 10px;
        color: rgb(97, 86, 86);
      }
      
      .read-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 20px;
      }
      .read-btn a{
        text-decoration: none;
        padding: 6px 12px;
        background: rgb(227, 248, 247);
        border-radius: 10px;
        color: rgb(6, 81, 121);
      }

     </style>
</head>
<body>
  <div class="card-container">
    <div class="card">
      <div class="card-img">
        <img src="card.png" alt="card-img">
      </div>
      <div class="button">
        <button>Nature</button>
        <button>Lake</button>
      </div>
      <div class="content">
      <h3>Front-End Developer</h3>
      <p>A passionate web development learner focused on mastering HTML and CSS through hands-on projects.</p>
      </div>
      <div class="read-btn">
        <a href="#">Read More</a>
      </div>
    </div>
  </div>
</body>
</html>
