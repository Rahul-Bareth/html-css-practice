<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Filters</title>

  <style>
    img {
      height: 300px;
      /* filter: blur(3px); */
    } 

    .img1 {
      filter: brightness(53%) contrast(220%);
    }

    .img2 {
      filter: sepia(50%);
    }

    .img3 {
      /* opacity: 0.45; */
      /* filter: invert(1); */
      filter: grayscale(90%);
    }
  </style>
</head>
<body>

  <div class="container">
    <img class="img1" src="card1.jpg" alt="img">
    <img class="img2" src="https://www.opindia.com/wp-content/uploads/2023/01/srk.jpg">
    <img class="img3" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTn0vU-hiN42syYnYMQ0qRl-CYfcfsk1PiXcIw--BWboI15U933wSzU4KmU&s=10">
  </div>
</body>
</html>
